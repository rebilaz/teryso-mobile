name: Refresh Expo SDK 57 dependencies

on:
  push:
    paths:
      - .github/workflows/refresh-expo-deps.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci

      - name: Align packages with Expo SDK
        run: npx expo install --fix

      - name: Remove remaining lint warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/portfolio/rules-slide.tsx')
          text = path.read_text()
          old = "      refresh ? setRefreshing(true) : setLoading(true);"
          new = "      if (refresh) {\n        setRefreshing(true);\n      } else {\n        setLoading(true);\n      }"
          if old not in text:
              raise SystemExit('Expected rules-slide expression not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify refreshed project
        run: |
          npm run typecheck
          npm run lint
          npm run doctor

      - name: Commit dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json components/portfolio/rules-slide.tsx
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "chore: align dependencies with Expo SDK 57"
          git push origin HEAD:main
