name: Fix production dependency audit

on:
  push:
    paths:
      - .github/workflows/fix-production-audit.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci

      - name: Apply non-breaking npm audit fixes
        shell: bash
        run: npm audit fix --omit=dev || true

      - name: Verify no high production advisories remain
        run: npm audit --omit=dev --audit-level=high

      - name: Restore development dependencies
        run: npm ci

      - name: Verify project
        run: |
          npm run typecheck
          npm run lint
          npm run doctor

      - name: Commit safe audit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore: resolve high production dependency advisory"
          git push origin HEAD:main
